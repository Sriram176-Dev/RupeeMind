name: Scheduled Cron Jobs

on:
  schedule:
    # Every day at 03:30 UTC (09:00 IST) for funds sync
    - cron: '30 3 * * *'
    # Every hour during market hours (03:45 to 10:00 UTC Mon-Fri) for signal history
    - cron: '45 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Job to execute'
        required: true
        default: 'funds-sync'
        type: choice
        options:
          - funds-sync
          - signal-history

jobs:
  funds-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Funds Sync Job
        env:
          API_URL: ${{ secrets.RENDER_API_URL || 'https://rupeemind-api.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering funds-sync job on ${API_URL}..."
          curl -f -X POST "${API_URL}/api/internal/jobs/funds-sync" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}"

  signal-history:
    runs-on: ubuntu-latest
    steps:
      - name: Update Signal History
        env:
          API_URL: ${{ secrets.RENDER_API_URL || 'https://rupeemind-api.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering signal-history job on ${API_URL}..."
          curl -f -X POST "${API_URL}/api/internal/jobs/signal-history" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}"
